[logger]
level = "INFO"

[http]
host = "0.0.0.0"
port = "8080"

[storage]
type = "sql"
dsn = "postgres://calendar:calendar@postgres:5432/calendar?sslmode=disable"

[kafka]
brokers = ["kafka:9092"]
topic = "calendar.notifications"
groupID = "calendar-storer"

[scheduler]
interval = "5s"
keepPeriod = "8760h"

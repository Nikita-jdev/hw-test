services:
  postgres:
    image: postgres:16-alpine
    container_name: calendar-postgres
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: применяет SQL-миграции после готовности БД
  migrate:
    image: postgres:16-alpine
    container_name: calendar-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: calendar
    volumes:
      - ../migrations:/migrations:ro
    command: >
      psql -h postgres -U calendar -d calendar -f /migrations/001_create_events.sql
    restart: "no"

  # Kafka в режиме KRaft — ZooKeeper не требуется
  kafka:
    image: apache/kafka:3.7.0
    container_name: calendar-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # one-shot: создаёт топик для уведомлений
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: calendar-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calendar.notifications --partitions 1 --replication-factor 1"
    restart: "no"

  calendar:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        CMD_PATH: ./cmd/calendar
    image: calendar:develop
    container_name: calendar-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8888:8080"

  scheduler:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        CMD_PATH: ./cmd/scheduler
    image: calendar_scheduler:develop
    container_name: calendar-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  storer:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        CMD_PATH: ./cmd/storer
    image: calendar_storer:develop
    container_name: calendar-storer
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  pgdata:

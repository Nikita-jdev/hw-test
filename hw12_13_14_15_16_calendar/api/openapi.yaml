openapi: 3.0.0
info:
  title: Calendar API
  description: HTTP API сервиса Календарь
  version: 1.0.0
paths:
  /events:
    post:
      summary: Создать событие
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Событие создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '409':
          description: Время занято другим событием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /events/{id}:
    put:
      summary: Обновить событие
      operationId: updateEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Событие обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Событие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Время занято другим событием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить событие
      operationId: deleteEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Событие удалено
        '404':
          description: Событие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /events/day:
    get:
      summary: Список событий на день
      operationId: listDayEvents
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: События дня
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /events/week:
    get:
      summary: Список событий на неделю
      operationId: listWeekEvents
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: События недели
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /events/month:
    get:
      summary: Список событий на месяц
      operationId: listMonthEvents
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: События месяца
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
components:
  schemas:
    EventInput:
      type: object
      required: [title, start_at, duration, user_id]
      properties:
        title:
          type: string
          description: Заголовок события
        start_at:
          type: string
          format: date-time
          description: Дата и время начала
        duration:
          type: integer
          format: int64
          description: Длительность в наносекундах
        user_id:
          type: integer
          format: int64
          description: ID владельца события
        description:
          type: string
          description: Описание события (опционально)
    Event:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              description: Уникальный идентификатор события
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string